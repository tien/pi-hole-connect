name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stage — e.g. v17 (or 17). Becomes the versionName, and the release tag once you publish the draft.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phone
            profile: pixel_6
          - device_type: sevenInch
            profile: Nexus 7
          - device_type: tenInch
            profile: Nexus 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build debug & test APKs for screenshots
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate ${{ matrix.device_type }} screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: bundle exec fastlane screenshots device_type:${{ matrix.device_type }} skip_build:true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}Screenshots
          if-no-files-found: error

  internal:
    needs: screenshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Write keystore to file
        run: echo ${{ secrets.KEYSTORE_BASE64 }} | base64 --decode > $GITHUB_WORKSPACE/keystore.jks

      - name: Resolve version from the dispatch input
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          # The tag is created only when the draft is published, so you can re-dispatch onto a newer commit first.
          version="${RAW_VERSION#[vV]}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::version must look like v17 or 17.0 (got: '$RAW_VERSION')"
            exit 1
          fi
          tag="v$version"
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)" = "false" ]; then
            echo "::error::$tag is already published. Pick a new version to stage."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Staging $tag (versionName $version) from ${GITHUB_SHA:0:8}"

      - name: Build & upload to internal track
        run: bundle exec fastlane internal
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS }}
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}

      - name: Stage the GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # No git tag is created yet — publishing this draft creates the tag and triggers promote.yml.
          apk="$(find artifacts -name '*.apk' | head -n1)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$SHA"
            gh release upload "$TAG" "$apk" --clobber
            echo "Re-staged $TAG at ${SHA:0:8} with a fresh APK."
          else
            gh release create "$TAG" \
              --draft \
              --target "$SHA" \
              --title "$TAG" \
              --generate-notes \
              "$apk"
            echo "Created draft $TAG at ${SHA:0:8}."
          fi
