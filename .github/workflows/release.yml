name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# A push that lands while a previous run is mid-flight should supersede it: only the
# newest commit's build belongs on the internal track and in the rolling draft.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phone
            profile: pixel_6
          - device_type: sevenInch
            profile: Nexus 7
          - device_type: tenInch
            profile: Nexus 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build debug & test APKs for screenshots
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate ${{ matrix.device_type }} screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: bundle exec fastlane screenshots device_type:${{ matrix.device_type }} skip_build:true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}Screenshots
          if-no-files-found: error

  internal:
    needs: screenshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-phone
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-sevenInch
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-tenInch
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      - name: Write keystore to file
        run: echo ${{ secrets.KEYSTORE_BASE64 }} | base64 --decode > $GITHUB_WORKSPACE/keystore.jks

      - name: Resolve version name from the rolling draft
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The maintainer sets the next version by naming the draft's tag (e.g. v17.0).
          # Until a draft exists, builds carry a placeholder version name.
          tag="$(gh release list --limit 100 --json tagName,isDraft \
            --jq 'first(.[] | select(.isDraft) | .tagName) // empty')"
          version="${tag#v}"
          [ -z "$version" ] && version="0.0.0-snapshot"
          {
            echo "tag=${tag:-v0.0.0-snapshot}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Building version $version (draft tag ${tag:-<none>})"

      - name: Build & upload to internal track
        run: bundle exec fastlane internal
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS }}
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}

      - name: Refresh the rolling GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Keep exactly one draft, preserving the maintainer's manually chosen tag. Delete any
          # existing draft(s), then recreate one pointing at this commit with the fresh APK and
          # auto-generated notes. The tag becomes a real git tag only when the draft is published.
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' \
            | while read -r existing; do
                [ -n "$existing" ] && gh release delete "$existing" --yes --cleanup-tag || true
              done

          apk="$(find artifacts -name '*.apk' | head -n1)"
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "$apk"
