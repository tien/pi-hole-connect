name: Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Version Name
        required: true

permissions:
  contents: write
  models: read

jobs:
  screenshots:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phone
            profile: pixel_6
          - device_type: sevenInch
            profile: Nexus 7
          - device_type: tenInch
            profile: Nexus 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build debug & test APKs for screenshots
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate ${{ matrix.device_type }} screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: bundle exec fastlane screenshots device_type:${{ matrix.device_type }} skip_build:true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}Screenshots
          if-no-files-found: error

  create-release:
    needs: screenshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so we can diff against the last release tag

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-phone
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-sevenInch
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-tenInch
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      - name: Write keystore to file
        run: echo ${{ secrets.KEYSTORE_BASE64 }} | base64 --decode > $GITHUB_WORKSPACE/keystore.jks

      - name: Collect changes since last release
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          git log "${PREV_TAG:+$PREV_TAG..}HEAD" --no-merges --pretty=format:'- %s' > changes.txt
          echo "Changes since ${PREV_TAG:-start}:"; cat changes.txt

      - name: Generate Play Store notes (English)
        id: notes_en_us
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/play-store-release-notes.prompt.yml
          input: |
            language: English
          file_input: |
            changes: changes.txt

      - name: Generate Play Store notes (German)
        id: notes_de_de
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/play-store-release-notes.prompt.yml
          input: |
            language: German
          file_input: |
            changes: changes.txt

      - name: Generate Play Store notes (Polish)
        id: notes_pl_pl
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/play-store-release-notes.prompt.yml
          input: |
            language: Polish
          file_input: |
            changes: changes.txt

      - name: Generate Play Store notes (Romanian)
        id: notes_ro
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/play-store-release-notes.prompt.yml
          input: |
            language: Romanian
          file_input: |
            changes: changes.txt

      - run: bundle exec fastlane release
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS }}
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FL_SET_GITHUB_RELEASE_REPOSITORY_NAME: ${{ github.repository }}
          FL_GITHUB_RELEASE_API_BEARER: ${{ github.token }}
          FL_SET_GITHUB_RELEASE_TAG_NAME: v${{ github.event.inputs.versionName }}
          FL_SET_GITHUB_RELEASE_COMMITISH: ${{ github.sha }}
          VERSION_NAME: ${{ github.event.inputs.versionName }}
          PLAY_RELEASE_NOTES_EN_US: ${{ steps.notes_en_us.outputs.response }}
          PLAY_RELEASE_NOTES_DE_DE: ${{ steps.notes_de_de.outputs.response }}
          PLAY_RELEASE_NOTES_PL_PL: ${{ steps.notes_pl_pl.outputs.response }}
          PLAY_RELEASE_NOTES_RO: ${{ steps.notes_ro.outputs.response }}
