name: Promote to production

on:
  release:
    types: [released]

permissions:
  contents: read
  models: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Collect changes since previous release
        env:
          CURRENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)"
          git log "${PREV_TAG:+$PREV_TAG..}${CURRENT_TAG}" --no-merges --pretty=format:'- %s' > changes.txt
          echo "Changes since ${PREV_TAG:-start}:"; cat changes.txt

      - name: Generate Play Store notes
        id: notes
        uses: actions/ai-inference@v2
        with:
          prompt-file: .github/prompts/play-store-release-notes.prompt.yml
          input: |
            language: English
          file_input: |
            changes: changes.txt

      - name: Find the release build that generated the screenshots
        id: screenshots_run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          run_id="$(gh run list \
            --workflow=release.yml \
            --commit "${SHA}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -z "${run_id}" ]; then
            echo "No successful release run found for ${SHA}; cannot fetch screenshots." >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Using release run ${run_id} for screenshots"

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-phone
          path: fastlane/metadata/android/en-US/images/phoneScreenshots
          github-token: ${{ github.token }}
          run-id: ${{ steps.screenshots_run.outputs.run_id }}

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-sevenInch
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots
          github-token: ${{ github.token }}
          run-id: ${{ steps.screenshots_run.outputs.run_id }}

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-tenInch
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots
          github-token: ${{ github.token }}
          run-id: ${{ steps.screenshots_run.outputs.run_id }}

      - run: bundle exec fastlane promote
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS }}
          PLAY_RELEASE_NOTES: ${{ steps.notes.outputs.response }}
